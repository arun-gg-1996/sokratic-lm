[pytest]
asyncio_mode = auto
# F8 (POST_DEMO_FIXES.md, 2026-05-06): default-skip markers that
# require external resources (live LLM, real Qdrant, fresh ingestion).
# Run them explicitly with `-m <marker>` when those resources are
# available — e.g. `pytest -m data_quality` after `make ingest`.
addopts = -m "not integration and not scenarios and not data_quality"
markers =
    integration: real LLM calls, requires ANTHROPIC_API_KEY
    scenarios: multi-turn conversation scenarios, requires ANTHROPIC_API_KEY
    data_quality: corpus / retrieval quality gates, requires fresh ingestion + live Qdrant
    asyncio: async test (handled by pytest-asyncio in auto mode)
