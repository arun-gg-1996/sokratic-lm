domain:
  name: "physics"
  short: "physics"
  student_descriptor: "student"
  kb_collection: "sokratic_physics_kb"
  memory_collection: "sokratic_physics_memory"
  mem0_namespace: "physics"
  # retrieval_domain matches the ingestion source name (ingestion/sources/openstax_physics)
  # AND the artifact-path suffix in config/base.yaml (chunks_openstax_physics, etc.).
  # Anatomy uses the same convention: retrieval_domain="openstax_anatomy".
  retrieval_domain: "openstax_physics"

  # Used as concrete examples in prompts so the LLM understands the expected format
  example_topic_specific: "Newton's third law"
  example_topic_broad: "classical mechanics"
  example_question: "What is the relationship between force and acceleration?"
  example_answer: "Newton's third law"
  example_answer_format: "law name, quantity, or principle (e.g. 'Newton's third law', 'conservation of momentum')"

  # Terms so generic they should not be accepted as locked topics without a sub-focus
  generic_topic_terms:
    - physics
    - study
    - topic
    - force
    - forces
    - energy
    - motion
    - wave
    - waves
    - field
    - fields
    - law
    - laws
    - principle
    - principles
    - mechanics
    - electricity
    - magnetism
    - optics
    - thermodynamics

  # ─── Anchor leak-detection word lists (per-domain) ──────────────────────
  # Physics counterpart of anatomy's anchor_false_positives. Generic
  # quantity / concept nouns that recur in Socratic scaffolding without
  # naming a specific answer ("the force on the block...", "what mass...").
  # When locked_answer is one of these, dean.py won't block the teacher
  # from saying it — too generic to count as a leak.
  anchor_false_positives:
    # Generic quantities
    - force
    - mass
    - weight
    - velocity
    - speed
    - acceleration
    - momentum
    - impulse
    - energy
    - work
    - power
    - pressure
    - density
    - volume
    - distance
    - displacement
    - position
    - time
    - frequency
    - wavelength
    - amplitude
    - period
    - field
    - charge
    - current
    - voltage
    - resistance
    - capacitance
    - inductance
    - flux
    - vector
    # Generic descriptors
    - left
    - right
    - up
    - down
    - vertical
    - horizontal
    - parallel
    - perpendicular
    - linear
    - angular
    - net
    - total
    - external
    - internal
    - constant
    - variable

  # Physics short symbols / units distinctive enough to leak-block. The
  # parallel of anatomy's "SA", "ATP" set — quantities a tutor could
  # mention by symbol where naming would give the answer.
  distinctive_short_abbreviations:
    # Mechanics quantity symbols
    - f
    - m
    - a
    - v
    - p
    - ke
    - pe
    - w
    - j
    - n
    # Rotational / angular
    - i
    - l
    # Waves / oscillations
    - hz
    - shm
    # Fluids / thermo
    - pa
    - rho
    # Common physics acronyms
    - fbd
    - com
    - cg
    - si
    # E&M
    - emf
    - ohm
    - vac
    - dc
    # Modern / nuclear
    - ev
    - mev
    - gev

  # Drives post-answer assessment framing
  assessment_dimension: "real-world application"
  assessment_dimension_examples: "problem-solving, physical phenomena, or engineering context"

  # ─── L78 / L9 / L77 / L74 / L19 — per-domain config slots ────────────────
  # Curated abbreviation list (per L9). Physics seed list — extend as needed.
  curated_abbrevs_path: "data/curated_abbrevs_openstax_physics.json"

  # VLM (image upload) — DISABLED for physics (per user, 2026-05-02).
  # Frontend hides the upload button; backend rejects image upload requests.
  vlm:
    enabled: false

  # Clinical scenario framing (per L74 / L78). Physics gets engineering /
  # apparatus framing rather than patient-case framing.
  clinical_scenario_style: "engineering problem, lab apparatus, or measurement scenario with a quantitative question"

  # Display-label rewrite tone (per L19 / L78).
  display_label_style: "concise student-friendly physics phrasing"

# Topic-index (TOC-grounded topic menu) configuration.
# Mirrors ot.yaml shape; junk_patterns are physics-specific (OpenStax
# University Physics doesn't use the OT/A&P callout vocabulary).
topic_index:
  min_chunk_count: 1
  limited_chunk_threshold: 2
  junk_patterns:
    - "INTERACTIVE LINK"
    - "EVERYDAY CONNECTION"
    - "INDEX"
    - "PROBLEMS"
    - "ADDITIONAL PROBLEMS"
    - "CHALLENGE PROBLEMS"
    - "CHAPTER REVIEW"
    - "REVIEW QUESTIONS"
    - "CONCEPTUAL QUESTIONS"
  junk_suffixes:
    - "..."
